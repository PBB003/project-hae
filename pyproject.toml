[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-hae"
version = "2.0.0"
description = "Contexto, catálogo y memoria verificable para agentes"
requires-python = ">=3.12"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-typescript>=0.23"]

[project.scripts]
hae = "client.hae_sync:main"

[tool.setuptools.packages.find]
include = ["client*", "server*"]
namespaces = true
